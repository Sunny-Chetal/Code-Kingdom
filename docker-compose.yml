services:
  postgres:
    image: postgres:17
    container_name: code-kingdom-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: codekingdom
      POSTGRES_PASSWORD: localdevonly
      POSTGRES_DB: codekingdom
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
